<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #ffffff; border: 1px solid #dfe3e8; border-radius: 8px">

<a href="Results.dc.html">R2A</a><span style="text-align: right">1,736</span><span style="text-align: right">818</span>
<a href="Results.dc.html">Z4C</a><span style="text-align: right">2,101</span><span style="text-align: right">2,025</span>
